name: CI

on:
  push:
    branches:
      - main
      - devel
  pull_request:

permissions:
  contents: read

concurrency:
  group: nifkit-wasm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: Build and test WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Nim
        uses: jiro4989/setup-nim-action@1dba098c77a0e800c96a7d92a0888ac2af26f19f # v2
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 4.0.21
      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          nim --version
          emcc --version
          google-chrome --version
      - name: Install TypeScript
        run: npm install
      - name: Build and test package
        run: npm test
